<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Lens Mobile</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, system-ui, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; text-align: center; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; margin-top: 20px; }
    .btn { display: inline-block; background: #ef5b3f; color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 700; text-decoration: none; cursor: pointer; border: none; font-size: 14px; }
    .result { margin-top: 20px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Local Lens Mobile</h1>
  <p>100% Private On-Device AI Image Detector</p>
  <div class="card">
    <input type="file" id="file-input" accept="image/*" style="display:none;">
    <button class="btn" onclick="document.getElementById('file-input').click()">Choose Image / Take Photo</button>
    <div id="result" class="result"></div>
  </div>
</body>
</html>
